name: NOTAMs

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/notam.yml", "tools/build_notam.py", "notam-airports.txt"]

permissions:
  contents: write

concurrency:
  group: notam
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/build_notam.py out
      - name: Auf Branch notam veröffentlichen
        run: |
          cd out
          git init -q -b notam
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add notam.json
          git commit -qm "NOTAMs $(date -u +%H%MZ)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" notam
